name: Daily odds & Venn refresh (Claude)
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
jobs:
  odds:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python claude_update.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "wc-bot"
          git config user.email "bot@berkeleyhome.co.uk"
          git add data.json
          git diff --cached --quiet || git commit -m "daily odds/venn refresh"
          git push
