name: Update leaderboard
on:
  schedule:
    - cron: "13,33,53 * * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python update_data.py
      - name: Commit if changed
        run: |
          git config user.name "wc-bot"
          git config user.email "bot@berkeleyhome.co.uk"
          git add data.json
          git diff --cached --quiet || git commit -m "leaderboard update"
          git push
